[project]
name = "dc-cma-echo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.0",
    "aws-croniter>=1.0.5",
    "aws-v2",
    "boto3>=1.40.69",
    "fastapi[standard]>=0.118.0",
    "jinja2>=3.1.6",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.43",
]

[dependency-groups]
dev = [
    "isort>=7.0.0",
]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["src", "api", "core", "db", "utils"]

[tool.uv.sources]
aws-v2 = { git = "https://github.com/crodenas/aws_v2.git" }
