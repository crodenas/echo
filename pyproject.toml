[project]
name = "dc-cma-echo"
version = "0.1.0"
description = "Enterprise campaign management system for automated resource inventory verification"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.0",
    "aws-croniter>=1.0.5",
    "aws-v2",
    "boto3>=1.40.69",
    "fastapi[standard]>=0.118.0",
    "jinja2>=3.1.6",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.43",
]

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["api", "core", "db", "services", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
aws-v2 = { git = "https://github.com/crodenas/aws_v2.git" }
