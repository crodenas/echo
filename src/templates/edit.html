<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo - Edit Campaign</title>
</head>
<body>
    <h1>Edit Campaign</h1>
    {% if campaign %}
    <form action="/edit" method="post">
        <input type="hidden" name="campaign_id" value="{{ campaign.id }}">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ campaign.name }}" required><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description">{{ campaign.description }}</textarea><br>

        <label for="campaign_schedule">Campaign Schedule:</label>
        <input type="text" id="campaign_schedule" name="campaign_schedule" value="{{ campaign.campaign_schedule }}" required><br>

        <label for="cycle_schedule">Cycle Schedule:</label>
        <input type="text" id="cycle_schedule" name="cycle_schedule" value="{{ campaign.cycle_schedule }}" required><br>

        <label for="max_events">Max Events:</label>
        <input type="number" id="max_events" name="max_events" value="{{ campaign.max_events }}" required><br>

        <button type="submit">Update</button>
    </form>
    {% else %}
    <p>Campaign not found.</p>
    {% endif %}
    <nav>
        <a href="/view?campaign_id={{ campaign.id }}">View</a>
        <a href="/list">Back to List</a>
        <a href="/">Home</a>
    </nav>
</body>
</html>
